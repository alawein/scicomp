name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and core test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run verified Python core tests
        run: python -m pytest --cov=Python --cov-report=term-missing --cov-report=xml
      - name: Run first-run core example
        env:
          MPLBACKEND: Agg
          BERKELEY_SCICOMP_QUIET: "1"
        run: python examples/beginner/getting_started.py

  build:
    name: Build and install distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade pip build && python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/scicomp-wheel
          /tmp/scicomp-wheel/bin/python -m pip install --upgrade pip
          /tmp/scicomp-wheel/bin/python -m pip install dist/*.whl
          BERKELEY_SCICOMP_QUIET=1 /tmp/scicomp-wheel/bin/python -c "import Python; print(Python.__version__)"

  optional-extras:
    name: Optional extra (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [viz, quantum, ml]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install selected experimental extra
        run: python -m pip install --upgrade pip && python -m pip install -e ".[${{ matrix.extra }}]"
      - name: Confirm selected extra metadata
        run: python -c "from importlib.metadata import requires; assert any(\"${{ matrix.extra }}\" in item for item in requires('scicomp') if item); print('installed ${{ matrix.extra }}')"
