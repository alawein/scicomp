[build-system]
requires = ["setuptools>=69", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"
[project]
name = "scicomp"
dynamic = ["version"]
description = "SciComp - A Cross-Platform Scientific Computing Suite for Research and Education"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Meshal Alawein", email = "contact@meshal.ai"},
]
maintainers = [
    {name = "Meshal Alawein", email = "contact@meshal.ai"},
]
keywords = [
    "berkeley", "scicomp", "quantum", "physics", "scientific-computing",
    "machine-learning", "gpu-acceleration", "thermal-transport",
    "quantum-optics", "spintronics", "materials-science", "climate-modeling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "matplotlib>=3.3.0",
    "sympy>=1.8",
    "h5py>=3.0.0",
    "pandas>=1.5",
    "joblib>=1.1.0",
    "psutil>=5.9",
]
[project.optional-dependencies]
gpu = ["cupy-cuda12x>=12.0.0"]
quantum = [
    "networkx>=3.0",
    "qiskit>=1.0",
    "cirq>=1.3",
    "pennylane>=0.35",
]
ml = [
    "tensorflow>=2.8.0",
    "torch>=1.11.0",
    "scikit-learn>=1.0.0",
]
performance = [
    "numba>=0.56.0",
    "dask>=2022.0.0",
]
viz = [
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "ipywidgets>=7.6.0",
]
visualization = [
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "ipywidgets>=7.6.0",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "nbsphinx>=0.8.0",
    "jupyter>=1.0.0",
]
dev = [
    "build>=1.2",
    "pytest>=7.4",
    "pytest-cov>=4.1",
]
all = [
    "cupy-cuda12x>=12.0.0",
    "tensorflow>=2.8.0",
    "torch>=1.11.0",
    "scikit-learn>=1.0.0",
    "numba>=0.56.0",
    "dask>=2022.0.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "ipywidgets>=7.6.0",
    "networkx>=3.0",
    "qiskit>=1.0",
    "cirq>=1.3",
    "pennylane>=0.35",
]
[project.scripts]
scicomp = "Python.utils.cli:main"
bsc = "Python.utils.cli:main"
[project.urls]
Homepage = "https://github.com/alawein/scicomp"
Repository = "https://github.com/alawein/scicomp"
"Bug Reports" = "https://github.com/alawein/scicomp/issues"
Changelog = "https://github.com/alawein/scicomp/blob/main/CHANGELOG.md"
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["Python*"]
[tool.setuptools.package-data]
"Python" = ["*/data/*.dat", "*/data/*.json", "*/examples/*.py", "*/tests/*.py"]
[tool.setuptools_scm]
write_to = "Python/_version.py"
fallback_version = "0+unknown"
# Black code formatting
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
# isort import sorting
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
# Flake8 linting
[tool.flake8]
max-line-length = 100
ignore = ["E203", "W503", "E501"]
per-file-ignores = [
    "__init__.py:F401",
]
# MyPy type checking
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
# Pytest configuration
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "ml: marks tests as requiring ML libraries",
    "integration: marks tests as integration tests",
]
# Coverage configuration
[tool.coverage.run]
source = ["Python"]
relative_files = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
]
[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
